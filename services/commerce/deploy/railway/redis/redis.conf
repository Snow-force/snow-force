bind 0.0.0.0 ::
protected-mode yes
port 0
tls-port 6379
tls-cert-file /tmp/snowforce-redis-tls/server.pem
tls-key-file /tmp/snowforce-redis-tls/server-key.pem
tls-ca-cert-file /tmp/snowforce-redis-tls/ca.pem
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /tmp/snowforce-redis-tls/users.acl
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
maxmemory 128mb
maxmemory-policy noeviction
