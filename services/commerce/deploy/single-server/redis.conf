bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/secrets/redis_server_cert
tls-key-file /run/secrets/redis_server_key
tls-ca-cert-file /run/secrets/redis_ca
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /run/secrets/redis_acl

dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
maxmemory 128mb
maxmemory-policy noeviction
